version: 1
name: mvp_ship
steps:
  - id: plan
    type: agent
    role: planner
    on:
      planned: review
  - id: review
    type: agent
    role: reviewer
    inputs:
      plan:
        step: plan
        output: plan
    on:
      approved: implement
      revise: plan
      question: ask
  - id: implement
    type: agent
    role: implementer
    inputs:
      plan:
        step: plan
        output: plan
      review:
        step: review
        output: review
    on:
      done: end
  - id: ask
    type: human
    prompt: "Clarification needed for the plan"
    on:
      answered: replan
  - id: replan
    type: agent
    role: planner
    inputs:
      clarification:
        step: ask
        output: response
    on:
      planned: review_replan
  - id: review_replan
    type: agent
    role: reviewer
    inputs:
      plan:
        step: replan
        output: plan
    on:
      approved: implement_replan
      revise: replan
      question: ask
  - id: implement_replan
    type: agent
    role: implementer
    inputs:
      plan:
        step: replan
        output: plan
      review:
        step: review_replan
        output: review
    on:
      done: end
  - id: end
    type: end